name: AI Factory
on:
  issues:
    types: [opened, labeled, edited]
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, ready_for_review, reopened]
  workflow_run:
    workflows: [CI]
    types: [completed]
  schedule:
    - cron: '*/30 * * * *'
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      issue:
        description: Requirements issue number (empty scans all)
        type: string
        required: false
permissions: {}
jobs:
  requirements:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 * * * *') ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
       (github.event.action == 'edited' || github.event.action == 'labeled') &&
       contains(github.event.issue.labels.*.name, 'requirements'))
    permissions:
      contents: read
      issues: write
    uses: roy2392/ai-factory/.github/workflows/reusable-requirements.yml@v1.1
    with:
      factory_repo: roy2392/ai-factory
      factory_ref: v1.1
    secrets:
      FACTORY_APP_ID: ${{ secrets.FACTORY_APP_ID }}
      FACTORY_APP_PRIVATE_KEY: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
      COPILOT_ASSIGN_TOKEN: ${{ secrets.COPILOT_ASSIGN_TOKEN }}
      COPILOT_CLI_TOKEN: ${{ secrets.COPILOT_CLI_TOKEN }}
  self-heal:
    if: github.event_name == 'workflow_run'
    permissions:
      actions: read
      pull-requests: write
      issues: write
    uses: roy2392/ai-factory/.github/workflows/reusable-self-heal.yml@v1.1
    with:
      factory_repo: roy2392/ai-factory
      factory_ref: v1.1
    secrets:
      FACTORY_APP_ID: ${{ secrets.FACTORY_APP_ID }}
      FACTORY_APP_PRIVATE_KEY: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
      COPILOT_ASSIGN_TOKEN: ${{ secrets.COPILOT_ASSIGN_TOKEN }}
  watchdog:
    if: (github.event_name == 'schedule' && github.event.schedule == '*/30 * * * *') || github.event_name == 'workflow_dispatch'
    permissions:
      issues: write
      pull-requests: write
    uses: roy2392/ai-factory/.github/workflows/reusable-watchdog.yml@v1.1
    with:
      factory_repo: roy2392/ai-factory
      factory_ref: v1.1
    secrets:
      FACTORY_APP_ID: ${{ secrets.FACTORY_APP_ID }}
      FACTORY_APP_PRIVATE_KEY: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
  ai-command:
    if: github.event_name == 'issue_comment'
    permissions:
      contents: read
      issues: write
    uses: roy2392/ai-factory/.github/workflows/reusable-ai-command.yml@v1.1
    with:
      factory_repo: roy2392/ai-factory
      factory_ref: v1.1
    secrets: inherit
  dispatch:
    if: github.event_name == 'issues'
    permissions:
      contents: read
      issues: write
    uses: roy2392/ai-factory/.github/workflows/reusable-dispatch.yml@v1.1
    with:
      factory_repo: roy2392/ai-factory
      factory_ref: v1.1
    secrets: inherit
  automerge:
    if: github.event_name == 'pull_request_target'
    permissions:
      contents: read
      pull-requests: write
    uses: roy2392/ai-factory/.github/workflows/reusable-automerge.yml@v1.1
    with:
      factory_repo: roy2392/ai-factory
      factory_ref: v1.1
    secrets: inherit
